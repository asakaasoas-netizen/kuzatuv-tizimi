name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev build-essential libncurses5
          pip install --upgrade buildozer "Cython<3.0" virtualenv

      - name: Build with Buildozer
        working-directory: ./client
        run: |
          yes | buildozer android debug || true
          buildozer android debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: System-Sync-APK
          path: ./client/bin/*.apk
