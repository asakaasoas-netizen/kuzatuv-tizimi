name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Swap xotirasi (Out of Memory xatoligidan himoya)
      - name: Setup Swap Memory
        run: |
          if [ ! -f /swapfile ]; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            echo "Swapfile already exists, skipping..."
          fi
          free -h

      # ✅ Java 17 — rasmiy action orqali (PATH muammosi yo'q)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Java versiyasini tekshirish
      - name: Verify Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ✅ Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ Barcha kerakli tizim kutubxonalari
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev cmake \
            libffi-dev libssl-dev \
            build-essential \
            libncurses5 libncurses5-dev \
            libncursesw5 libncursesw5-dev \
            libtinfo5 \
            lzma liblzma-dev

      # ✅ Cython aniq versiyasi + Buildozer
      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.37"
          pip install --upgrade buildozer virtualenv

      # ✅ SDK litsenziyalarini oldindan qabul qilish
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg

      # ✅ Kesh (keyingi build'lar tez bo'lishi uchun)
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-v5-${{ runner.os }}-${{ hashFiles('client/buildozer.spec') }}
          restore-keys: |
            buildozer-v5-${{ runner.os }}-

      # ✅ APK yig'ish — JAVA_HOME aniq ko'rsatilgan
      - name: Build APK with Buildozer
        working-directory: ./client
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      # ✅ Xatolik bo'lsa log faylni yuklash
      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ./client/build.log

      # ✅ APK faylni yuklash
      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: System-Sync-APK
          path: ./client/bin/*.apk
          retention-days: 7
